<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Assignment 2</h1>
        <p>Dataset: Greenhouse Gas Emissions 1990-2018</p>

        <div class="controls">
            <label for="yearSlider" class="form-label">Year: <span id="yearLabel">2000</span></label>
            <input id="yearSlider" class="form-range" type="range" min="1980" max="2018" value="2000" step="1">

            <div class="row g-2">
                <div class="col-4">
                    <label for="xVariable" class="form-label">X</label>
                    <select id="xVariable" class="form-select variable"></select>
                </div>
                <div class="col-4">
                    <label for="yVariable" class="form-label">Y</label>
                    <select id="yVariable" class="form-select variable"></select>
                </div>
                <div class="col-4">
                    <label for="zVariable" class="form-label">Z</label>
                    <select id="zVariable" class="form-select variable"></select>
                </div>
            </div>
        </div>

        <div id="legend"></div>
        <div id="tooltip"></div>
        <div id="vis"></div>
        <p>Disclaimer: This visualization was generated with the Assistance of AI coding tools.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
